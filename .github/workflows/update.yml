name: Garmin Value Lab — Mise à jour Prix & Actualités

on:
  schedule:
    # Exécution automatique toutes les 15 minutes (remplacez 15 par 5 pour 5 min)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-garmin-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du moteur de veille (scraper.py)
        run: |
          python3 scraper.py

      - name: Publication de data.json si modifications détectées
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle donnée à commiter."
          else
            git commit -m "chore(data): mise à jour prix UE & news Garmin [skip ci]"
            git push
          fi
